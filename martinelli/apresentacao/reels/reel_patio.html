<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reel do pátio · Madeireira Martinelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600;700&family=Zilla+Slab:wght@600;700&display=swap">
<style>
/* Reel de exemplo "do pátio à sua obra" (S88, 27/11). Palco 1080 × 1920 escalado para caber; laço de 24 s.
   ?t=ms congela no instante para conferir. Movimento só com transform, opacity e stroke-dashoffset (Web Animations).
   Com prefers-reduced-motion: cenas trocam por corte, cada uma já pronta. */
:root{--nogueira:#2b1a10;--nogueira2:#1f120a;--mogno:#4a2a16;--cambara:#a8582a;--cambara-t:#8f4519;--mel:#e8b77a;--mel2:#d79a55;--areia:#dfcfae;--papel:#ede3cf;--linha:#cbb894;--cartao:#f8f2e5;--cinza:#6a5644;--zap:#1f8f4e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--nogueira2)}
body{font-family:'Barlow',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#palco{position:fixed;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;color:#fff;background:var(--nogueira2)}
.fundo{position:absolute;inset:-60px;background:linear-gradient(rgba(31,18,10,.8),rgba(31,18,10,.9)),url(madeira.webp) center/cover}
.cena{position:absolute;inset:0;opacity:0}
.fr{position:absolute;left:84px;right:84px;top:180px;margin:0;font:700 108px/1.04 'Zilla Slab',Georgia,serif;letter-spacing:-.012em;color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.5)}
em{font-style:normal;color:var(--mel)}
.ilu{position:absolute;left:0;width:1080px;overflow:visible}
.ilu .roda,.ilu .dia,.ilu .selo5,.ilu .po{transform-box:fill-box;transform-origin:center}
.ex{position:absolute;z-index:9;top:60px;right:60px;font:700 30px/1 'Barlow Condensed',sans-serif;letter-spacing:.2em;color:var(--mel);border:3px solid var(--mel);padding:12px 14px 11px 18px;border-radius:6px;background:rgba(31,18,10,.55)}
/* pé: faixa nogueira com borda mel; o logo chega como carimbo e desce para cá */
.pe{position:absolute;z-index:5;left:0;right:0;bottom:0;height:220px;background:var(--nogueira2);border-top:6px solid var(--mel)}
.marca{position:absolute;z-index:6;left:343px;top:1750px;width:394px;height:132px;color:var(--mel)}
.marca svg{position:relative;display:block;width:100%;height:100%;overflow:visible}
.moldura{position:absolute;inset:-34px -40px;border:5px solid var(--mel);border-radius:18px;background:rgba(31,18,10,.78);box-shadow:0 0 0 3px rgba(31,18,10,.6),0 30px 50px -20px #000;opacity:0}
.moldura::after{content:'';position:absolute;inset:9px;border:2px solid var(--mel);border-radius:11px;opacity:.7}

/* cena 2: celular */
.celw{position:absolute;left:250px;top:470px;width:580px;height:1160px}
.cel{width:100%;height:100%;border-radius:80px;background:#140b06;padding:20px;box-shadow:0 60px 90px -40px #000,inset 0 0 0 3px #4a2a16,inset 0 0 0 9px #1f120a}
.tela{position:relative;height:100%;border-radius:62px;overflow:hidden;background:#efe6d4;display:flex;flex-direction:column}
.st{height:66px;background:#3d2312;position:relative;flex:none}
.st::after{content:'';position:absolute;left:50%;top:16px;width:150px;height:36px;margin-left:-75px;border-radius:20px;background:#140b06}
.zt{height:132px;flex:none;background:var(--mogno);display:flex;align-items:center;gap:20px;padding:0 30px 0 18px}
.zt .av{position:relative;width:88px;height:88px;border-radius:50%;background:var(--nogueira2);display:grid;place-items:center;color:var(--mel);flex:none;box-shadow:0 0 0 3px rgba(232,183,122,.35)}
.zt .av::after{content:'';position:absolute;right:2px;bottom:4px;width:20px;height:20px;border-radius:50%;background:#3fbf6f;border:3px solid var(--mogno)}
.zt .ic{margin-left:auto;display:flex;gap:34px;color:var(--papel)}
.chat{flex:1;padding:26px 24px;display:flex;flex-direction:column;justify-content:flex-end;gap:22px;background-color:#efe6d4;background-image:radial-gradient(rgba(74,42,22,.1) 3px,transparent 3.6px),radial-gradient(rgba(74,42,22,.06) 2px,transparent 2.6px);background-size:56px 56px,56px 56px;background-position:0 0,28px 28px}
.verde{align-self:flex-end;width:440px;background:#d9fdd3;border-radius:30px;border-top-right-radius:8px;padding:12px 12px 10px;box-shadow:0 4px 4px rgba(31,18,10,.14);transform-origin:100% 100%}
.verde .img{display:block;width:100%;height:auto;border-radius:20px}
.verde .tk{position:relative;height:30px;margin-top:6px}
.verde .tk svg{position:absolute;right:8px;top:0;width:44px;height:30px}
.dig{align-self:flex-start;background:#fff;border-radius:30px;border-top-left-radius:8px;padding:28px 32px;display:flex;gap:14px;box-shadow:0 4px 4px rgba(31,18,10,.12)}
.dig i{width:20px;height:20px;border-radius:50%;background:var(--cinza)}
.barra{height:124px;flex:none;display:flex;align-items:center;gap:16px;padding:0 20px 8px;background:#e4d7bf}
.barra .campo{flex:1;height:78px;border-radius:40px;background:#fff;display:flex;align-items:center;padding:0 24px;color:#a08a63}
.barra .mic{width:84px;height:84px;border-radius:50%;background:var(--zap);display:grid;place-items:center;color:#fff;flex:none}

/* cena 3: etiquetas das pilhas */
.etqw{position:absolute;top:1496px}
.etq{display:inline-block;position:relative;font:700 48px/1 'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--mogno);background:var(--mel);padding:22px 76px 19px 30px;clip-path:polygon(0 0,calc(100% - 36px) 0,100% 50%,calc(100% - 36px) 100%,0 100%);transform-origin:12px 50%;box-shadow:inset 0 -6px 0 rgba(143,69,25,.25)}
.etq::after{content:'';position:absolute;right:46px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--nogueira)}

/* cena 4: conferência */
.lista{position:absolute;left:84px;right:84px;top:440px;background:var(--cartao);border-radius:30px;border-left:16px solid var(--cambara);padding:34px 48px;box-shadow:0 40px 70px -36px rgba(0,0,0,.95)}
.item{display:flex;align-items:center;gap:42px;height:132px;font:700 86px/1 'Zilla Slab',Georgia,serif;color:var(--mogno);letter-spacing:-.01em}
.item+.item{border-top:3px dashed var(--linha)}
.caixa{position:relative;width:92px;height:92px;flex:none;border:7px solid var(--mogno);border-radius:16px;background:#fff}
.caixa svg{position:absolute;left:-8px;top:-30px;width:124px;height:124px;overflow:visible}
.ck{fill:none;stroke:var(--cambara);stroke-width:17;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1}
.cam{position:absolute;overflow:visible}

/* cena 5: calendário */
.calw{position:absolute;left:250px;top:440px;width:580px;height:600px;transform:rotate(-2deg)}
.calw svg{display:block;width:100%;height:100%;overflow:visible}
.risco{fill:none;stroke:#a08a63;stroke-width:6;stroke-linecap:round;stroke-dasharray:1 1}
.circ{fill:none;stroke:var(--cambara);stroke-width:9;stroke-linecap:round;stroke-dasharray:1 1}
.ok{fill:none;stroke:var(--mogno);stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1}

/* cena 6: fecho */
.s6 .fr{top:210px;font-size:124px}
.ctaw{position:absolute;left:0;right:0;top:1300px;display:flex;justify-content:center}
.cta{display:inline-flex;align-items:center;gap:22px;background:var(--zap);color:#fff;border-radius:999px;padding:30px 52px 30px 40px;font:700 56px/1 'Barlow',sans-serif;box-shadow:0 0 0 6px rgba(232,183,122,.9),0 30px 50px -20px #000}
.cta svg{width:68px;height:68px;flex:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mA" viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="miter" stroke-miterlimit="6"><polyline points="8,52 60,10 112,52"/><path d="M22,106 V58 L41,84 L60,58 V106 M60,58 L79,84 L98,58 V106"/></g></symbol>
    <symbol id="lockA" viewBox="0 0 531 178"><use href="#mA" x="10" y="12" width="120" height="120"/><g fill="currentColor"><text x="150.333" y="38.667" font-family="'Barlow Condensed','Bahnschrift','Arial Narrow',sans-serif" font-weight="600" font-size="32" letter-spacing="25.815">MADEIREIRA</text><text x="149.667" y="117" font-family="'Zilla Slab',Rockwell,Georgia,serif" font-weight="700" font-size="82">Martinelli</text><text x="14.667" y="158" font-family="'Barlow Condensed','Bahnschrift','Arial Narrow',sans-serif" font-weight="600" font-size="19" letter-spacing="8.657">CONFIANÇA E HONESTIDADE, SEMPRE</text></g></symbol>
    <filter id="tinta" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/></filter>
    <symbol id="zap" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2z"/><path fill="currentColor" d="M8.6 6.9c-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.3.3-.9.9-.9 2.2s1 2.6 1.1 2.8c.1.2 1.9 3 4.7 4.1 2.3.9 2.8.7 3.3.7.5-.1 1.6-.7 1.9-1.3.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.5-.3l-1.8-.9c-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.3-.1-1.1-.4-2.1-1.3-.8-.7-1.3-1.5-1.5-1.8-.2-.3 0-.4.1-.5l.4-.4.3-.4c.1-.2 0-.3 0-.4l-.8-2.1z"/></symbol>
    <linearGradient id="vidro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1e6d4"/><stop offset="1" stop-color="#a99067"/></linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2414"/><stop offset="1" stop-color="#1f120a" stop-opacity="0"/></linearGradient>
    <radialGradient id="brilho" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<div id="palco">
  <div class="fundo"></div>

  <!-- 0–4 s · pátio -->
  <section class="cena s1">
    <h2 class="fr">Sua madeira, <em>do pátio à sua obra.</em></h2>
    <svg class="ilu" id="patio" style="top:700px;height:1100px" viewBox="0 0 1080 1100" aria-hidden="true"></svg>
  </section>

  <!-- 4–7 s · pedido -->
  <section class="cena s2">
    <h2 class="fr">Pedido pelo <em>WhatsApp.</em></h2>
    <div class="celw"><div class="cel"><div class="tela">
      <div class="st"></div>
      <div class="zt">
        <svg width="30" height="44" viewBox="0 0 30 44" aria-hidden="true"><path d="M24 6 8 22l16 16" fill="none" stroke="#ede3cf" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="av"><svg width="54" height="54" viewBox="0 0 120 120"><use href="#mA"/></svg></span>
        <span class="ic"><svg width="56" height="40" viewBox="0 0 56 40" aria-hidden="true"><rect x="3" y="6" width="34" height="28" rx="7" fill="none" stroke="currentColor" stroke-width="5"/><path d="M38 16 53 8v24l-15-8z" fill="currentColor"/></svg><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.2 15.2 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></span>
      </div>
      <div class="chat">
        <div class="verde"><svg class="img" id="pedido" viewBox="0 0 400 260" aria-hidden="true"></svg><div class="tk"><svg viewBox="0 0 44 30" aria-hidden="true"><path d="M3 16l7 7L24 7M18 21l3 3L39 6" fill="none" stroke="#8a9a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><svg class="azul" viewBox="0 0 44 30" aria-hidden="true"><path d="M3 16l7 7L24 7M18 21l3 3L39 6" fill="none" stroke="#2fa6de" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
        <div class="dig"><i></i><i></i><i></i></div>
      </div>
      <div class="barra"><span class="campo"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.3" fill="currentColor"/><circle cx="15" cy="10" r="1.3" fill="currentColor"/><path d="M8 14.5c1 1.5 2.4 2.2 4 2.2s3-.7 4-2.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span class="mic"><svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></div>
    </div></div></div>
  </section>

  <!-- 7–10 s · separação -->
  <section class="cena s3">
    <h2 class="fr">As peças separadas <em>no pátio.</em></h2>
    <svg class="ilu" id="pilhas" style="top:520px;height:1080px" viewBox="0 0 1080 1080" aria-hidden="true"></svg>
    <div class="etqw" style="left:70px"><span class="etq">Cambará</span></div>
    <div class="etqw" style="left:590px"><span class="etq">Cedrinho</span></div>
  </section>

  <!-- 10–14 s · descarga -->
  <section class="cena s4">
    <h2 class="fr" style="top:200px">Na descarga, <em>confira:</em></h2>
    <div class="lista">
      <div class="item"><span class="caixa"><svg viewBox="0 0 124 124" aria-hidden="true"><path class="ck" pathLength="1" d="M16 66 46 96 110 18"/></svg></span>espécie,</div>
      <div class="item"><span class="caixa"><svg viewBox="0 0 124 124" aria-hidden="true"><path class="ck" pathLength="1" d="M16 66 46 96 110 18"/></svg></span>bitola e</div>

    <svg class="ilu" id="desc" style="top:1110px;height:560px" viewBox="0 0 1080 560" aria-hidden="true"></svg>

  <section class="cena s6">
    <h2 class="fr">Do pátio à sua obra, <em>no dia combinado.</em></h2>
    <svg class="ilu" id="fecho" style="top:700px;height:500px" viewBox="0 0 1080 500" aria-hidden="true"></svg>
    <div class="ctaw"><span class="cta"><svg aria-hidden="true"><use href="#zap"/></svg>Peça o seu orçamento</span></div>

  <div class="pe"></div>

  <span class="ex">EXEMPLO</span>
</div>

<script>
(function(){
var T = 24000, RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
var EZ = 'cubic-bezier(.2,.8,.2,1)';
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return [].slice.call((r || document).querySelectorAll(s)); }
/* pseudo-aleatório com semente: o desenho sai igual a cada abertura */
var sd = 11; function R(){ sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; }
function f1(n){ return Math.round(n * 10) / 10; }

/* ---------- linha do tempo: A(el, [[segundo, {props}, easing?], ...]) dentro do laço de 24 s ---------- */
function A(el, fr, cena){
  if (!el || (RM && !cena)) return;
  var k = [];
  if (fr[0][0] > 0) k.push(Object.assign({ offset: 0, easing: 'linear' }, fr[0][1]));
  fr.forEach(function(f){ k.push(Object.assign({ offset: Math.min(1, f[0] / 24), easing: f[2] || EZ }, f[1])); });
  if (fr[fr.length - 1][0] < 24) k.push(Object.assign({ offset: 1 }, fr[fr.length - 1][1]));
  el.animate(k, { duration: T, iterations: Infinity });
}
/* movimento curto e contínuo (pontos, pulso): some com reduced-motion */
function L(el, k, dur, atraso){ if (!el || RM) return; el.animate(k, { duration: dur, iterations: Infinity, delay: atraso || 0, easing: 'ease-in-out' }); }

/* ---------- desenho: madeira com veio ---------- */
function veio(x, y, w, h, cor){
  var s = '', n = Math.max(2, Math.round(h / 11));
  for (var i = 0; i < n; i++){
    var yy = y + h * (i + .5) / n + (R() - .5) * 3, d = 'M' + x + ' ' + f1(yy);
    for (var xx = x; xx < x + w - 1; xx += 120){ var x2 = Math.min(x + w, xx + 120); d += ' Q' + f1((xx + x2) / 2) + ' ' + f1(yy + (R() - .5) * 6) + ' ' + f1(x2) + ' ' + f1(yy + (R() - .5) * 2); }
    s += '<path d="' + d + '" stroke="' + cor + '" stroke-width="' + f1(1.2 + R() * 1.4) + '" fill="none" opacity="' + (.22 + R() * .22).toFixed(2) + '"/>';
  }
  if (w > 240){ /* desenho de catedral */
    var cx = x + w * (.18 + R() * .64), b = y + h * .9;
    for (var k = 0; k < 3; k++){ var ww = 46 + k * 30, hh = h * (.9 + k * .25); s += '<path d="M' + f1(cx - ww) + ' ' + f1(b) + ' Q' + f1(cx + (R() - .5) * 20) + ' ' + f1(b - hh) + ' ' + f1(cx + ww) + ' ' + f1(b) + '" stroke="' + cor + '" stroke-width="1.8" fill="none" opacity=".3"/>'; }
  }
  if (w > 300 && R() > .4){ var nx = x + w * (.1 + R() * .8), ny = y + h * (.35 + R() * .3); s += '<ellipse cx="' + f1(nx) + '" cy="' + f1(ny) + '" rx="10" ry="' + f1(h * .16) + '" fill="' + cor + '" opacity=".45"/><ellipse cx="' + f1(nx) + '" cy="' + f1(ny) + '" rx="17" ry="' + f1(h * .26) + '" fill="none" stroke="' + cor + '" stroke-width="1.5" opacity=".35"/>'; }
  return s;
}
/* tábua vista de lado, com tampo e topo (anéis) */
function prancha(x, y, w, h, d, c){
  var dy = d * .7, s = '';
  s += '<polygon points="' + [x, y, x + d, y - dy, x + w + d, y - dy, x + w, y].join(' ') + '" fill="' + c.t + '"/>';
  s += veio(x + d * .5, y - dy * .85, w, dy * .7, c.l).replace(/opacity="[\d.]+"/g, 'opacity=".18"');
  s += '<polygon points="' + [x + w, y, x + w + d, y - dy, x + w + d, y + h - dy, x + w, y + h].join(' ') + '" fill="' + c.e + '"/>';
  var ex = x + w + d * .5, ey = y + h * .5 - dy * .5;
  for (var r = 1; r <= 3; r++) s += '<ellipse cx="' + f1(ex) + '" cy="' + f1(ey + h * .25) + '" rx="' + f1(d * .14 * r) + '" ry="' + f1(h * .16 * r) + '" fill="none" stroke="' + c.l + '" stroke-width="1.3" opacity=".45"/>';
  s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c.f + '"/>';
  s += veio(x, y, w, h, c.l);
  s += '<rect x="' + x + '" y="' + (y + h - 4) + '" width="' + w + '" height="4" fill="#1f120a" opacity=".3"/>';
  return s;
}
/* peça vista de topo (caibro, ripa): face com anéis, tampo e lateral */
var nclip = 0;
function topo(x, y, w, h, d, c, ripa){
  var dy = d * .74, id = 'cp' + (nclip++), s = '';
  s += '<polygon points="' + [x, y, x + d, y - dy, x + w + d, y - dy, x + w, y].join(' ') + '" fill="' + c.t + '"/>';
  s += '<polygon points="' + [x + w, y, x + w + d, y - dy, x + w + d, y + h - dy, x + w, y + h].join(' ') + '" fill="' + c.s + '"/>';
  s += '<clipPath id="' + id + '"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="2"/></clipPath>';
