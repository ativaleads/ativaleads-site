<!doctype html>
<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ativaleads · Novidades a caminho</title>
<meta name="description" content="Ativaleads Consultoria em Marketing Digital. Novidades a caminho.">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<style>
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(/assets/fonts/manrope-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF; }
@font-face { font-family: "Manrope"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(/assets/fonts/manrope-latin.woff2) format('woff2'); }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: "Manrope", "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; display: grid; grid-template-rows: 1fr auto; min-height: 100vh; min-height: 100dvh; }
main { display: grid; place-items: center; align-content: center; gap: 36px; padding: 48px 16px; text-align: center; }
.logo { position: relative; width: min(560px, 84vw); aspect-ratio: 1000 / 162; }
.logo img { position: absolute; inset: 0; width: 100%; height: 100%; }
h1 { margin: 0; font-size: clamp(1.35rem, 3.2vw, 2rem); font-weight: 700; letter-spacing: -.02em; }
.contato { margin: 0; font-size: .95rem; }
.contato a { color: inherit; }
footer { padding: 20px 16px 26px; text-align: center; font-size: .78rem; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

body { background: #0b1e2f radial-gradient(circle at 50% 38%, rgba(0,191,99,.20), transparent 55%); color: #fff; }
.contato, footer { color: #b9c7d1; }
.l-a, .l-texto { animation: foca .9s ease both; }
.l-check { transform-origin: 18% 85%; animation: estala .6s cubic-bezier(.3,1.6,.5,1) .85s both; }
.brilho { position: absolute; inset: 0; -webkit-mask: url(/assets/logo/anim/texto.webp) center / 100% 100% no-repeat; mask: url(/assets/logo/anim/texto.webp) center / 100% 100% no-repeat;
  background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.75) 50%, transparent 65%) no-repeat; background-size: 40% 100%; background-position: -60% 0;
  animation: brilho 5s ease-in-out 1.8s infinite; }
h1, .contato { animation: aparece .7s ease 1.4s both; }
.pontos span { animation: ponto 1.4s ease-in-out infinite; }
.pontos span:nth-child(2) { animation-delay: .2s; } .pontos span:nth-child(3) { animation-delay: .4s; }
@keyframes ponto { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
@keyframes foca { from { opacity: 0; filter: blur(10px); transform: scale(.96); } }
@keyframes estala { from { opacity: 0; transform: scale(0) rotate(-12deg); } }
@keyframes brilho { 0% { background-position: -60% 0; } 30%, 100% { background-position: 160% 0; } }
@keyframes aparece { from { opacity: 0; transform: translateY(10px); } }
</style>
</head>
<body>
<main>
  <div class="logo" role="img" aria-label="Ativaleads">
    <img class="l-a" src="/assets/logo/anim/a.webp" alt="">
    <img class="l-check" src="/assets/logo/anim/check.webp" alt="">
    <img class="l-texto" src="/assets/logo/anim/texto.webp" alt="">
    <span class="brilho" aria-hidden="true"></span>
  </div>
  <h1>Novidades a caminho<span class="pontos" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span></h1>
  <p class="contato"><a href="mailto:contato@ativaleads.com.br">contato@ativaleads.com.br</a></p>
</main>
<footer>Ativaleads Consultoria em Marketing Digital LTDA · CNPJ 52.788.441/0001-01 · São Paulo/SP</footer>
</body>
</html>
